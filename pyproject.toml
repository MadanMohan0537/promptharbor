[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "promptharbor"
version = "0.1.0"
description = "Versioned prompt releases with approvals, canaries, and rollback"
requires-python = ">=3.11"

[project.scripts]
promptharbor = "promptharbor.cli:main"

[tool.setuptools.packages.find]
include = ["promptharbor*"]
